<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's jobs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
            -webkit-tap-highlight-color: transparent;
        }
        .status-chip {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            display: inline-flex;
            align-items: center;
        }
        .status-received { background-color: #677D6A; color: #FFFFFF; }
        .status-assigned { background-color: #40534C; color: #FFFFFF; }
        .card {
            background: #FFFFFF;
            border: 1px solid #E8E4DA;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            color: #677D6A;
        }
        .nav-item.active {
            color: #1A3636;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <header id="header" class="px-4 pt-6 pb-2">
        <p class="text-[13px] font-medium text-[#677D6A]">Wednesday, 5 Sep</p>
        <h1 class="text-2xl font-bold mt-1">Today's jobs</h1>
    </header>

    <main class="flex-1 px-4 py-4 overflow-y-auto">
        <a href="job-detail.html" id="job-1" class="card block active:bg-gray-50 transition-colors">
            <div class="flex justify-between items-start mb-2">
                <div class="flex flex-col">
                    <span class="text-[13px] font-semibold text-[#1A3636]">Ridge Court · B12</span>
                    <h2 class="text-lg font-bold">Kitchen tap leak</h2>
                </div>
                <span class="status-chip status-assigned">Assigned</span>
            </div>
            <div class="flex items-center text-[#677D6A] text-sm gap-2">
                <i class="fa-solid fa-location-dot text-[12px]"></i>
                <span>14 Ridge Road, Cantonments</span>
            </div>
        </a>

        <div id="job-2" class="card">
            <div class="flex justify-between items-start mb-2">
                <div class="flex flex-col">
                    <span class="text-[13px] font-semibold text-[#1A3636]">Ridge Court</span>
                    <h2 class="text-lg font-bold">Shop 2 AC</h2>
                </div>
                <span class="status-chip status-received">Received</span>
            </div>
            <div class="flex items-center text-[#677D6A] text-sm gap-2">
                <i class="fa-solid fa-location-dot text-[12px]"></i>
                <span>14 Ridge Road, Cantonments</span>
            </div>
        </div>
    </main>

    <nav id="tab-bar" class="h-16 bg-white border-t border-[#E8E4DA] flex items-center px-4 sticky bottom-0">
        <a href="jobs.html" class="nav-item active">
            <i class="fa-solid fa-briefcase text-lg mb-1"></i>
            <span class="text-[11px] font-bold">Jobs</span>
        </a>
        <a href="account.html" class="nav-item">
            <i class="fa-solid fa-user text-lg mb-1"></i>
            <span class="text-[11px] font-medium">Account</span>
        </a>
    </nav>
</body>
</html>
