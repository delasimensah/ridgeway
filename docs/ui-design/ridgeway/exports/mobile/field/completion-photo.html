<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completion photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
            -webkit-tap-highlight-color: transparent;
        }
        .photo-area {
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #F9F8F6;
            border: 2px dashed #E8E4DA;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #677D6A;
            margin-bottom: 24px;
        }
        .cta-button {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 600;
            width: 100%;
        }
        .cta-primary {
            background-color: #1A3636;
            color: #FFFFFF;
        }
        .cta-primary:active {
            background-color: #40534C;
        }
        textarea {
            width: 100%;
            border: 1px solid #E8E4DA;
            border-radius: 6px;
            padding: 12px;
            font-family: inherit;
            resize: none;
            margin-bottom: 16px;
        }
        textarea:focus {
            outline: none;
            border-color: #1A3636;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <header id="header" class="px-4 py-4 border-b border-[#E8E4DA] flex items-center justify-between">
        <a href="update-status.html" class="w-10 h-10 flex items-center justify-start text-[#1A3636]">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </a>
        <h1 class="text-lg font-bold">Completion photo</h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 px-4 py-6 overflow-y-auto">
        <div id="camera-upload" class="photo-area">
            <i class="fa-solid fa-camera text-3xl mb-3"></i>
            <span class="font-semibold">Add completion photo</span>
        </div>

        <div id="caption-field">
            <label class="block text-sm font-bold uppercase tracking-wider mb-2 text-[#677D6A]">Caption (optional)</label>
            <textarea rows="3" placeholder="Describe the work done..."></textarea>
        </div>
    </main>

    <footer id="footer" class="p-4 border-t border-[#E8E4DA] bg-white">
        <a href="jobs.html" class="cta-button cta-primary">
            Save photo
        </a>
    </footer>
</body>
</html>
