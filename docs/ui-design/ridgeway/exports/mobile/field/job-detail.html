<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
            -webkit-tap-highlight-color: transparent;
        }
        .status-chip {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            display: inline-flex;
            align-items: center;
        }
        .status-assigned { background-color: #40534C; color: #FFFFFF; }
        .cta-button {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 600;
            width: 100%;
        }
        .cta-primary {
            background-color: #1A3636;
            color: #FFFFFF;
        }
        .cta-primary:active {
            background-color: #40534C;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <header id="header" class="px-4 py-4 border-b border-[#E8E4DA] flex items-center justify-between">
        <a href="jobs.html" class="w-10 h-10 flex items-center justify-start text-[#1A3636]">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </a>
        <h1 class="text-lg font-bold">Kitchen tap leak</h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 px-4 py-6 overflow-y-auto">
        <div id="job-info" class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xl font-bold">Ridge Court · B12</span>
                <span class="status-chip status-assigned">Assigned</span>
            </div>
            
            <div class="flex items-start text-[#677D6A] text-base gap-3 mb-6">
                <i class="fa-solid fa-location-dot mt-1"></i>
                <div class="flex flex-col">
                    <span class="font-medium">14 Ridge Road</span>
                    <span>Cantonments</span>
                </div>
            </div>

            <div id="instructions" class="bg-[#F9F8F6] border border-[#E8E4DA] rounded-lg p-4">
                <h3 class="text-sm font-bold uppercase tracking-wider mb-2 text-[#677D6A]">Instructions</h3>
                <p class="text-[#1A3636] leading-relaxed">
                    Confirm the leak with the tenant before starting.
                </p>
            </div>
        </div>
    </main>

    <footer id="footer" class="p-4 border-t border-[#E8E4DA] bg-white">
        <a href="update-status.html" class="cta-button cta-primary">
            Update status
        </a>
    </footer>
</body>
</html>
