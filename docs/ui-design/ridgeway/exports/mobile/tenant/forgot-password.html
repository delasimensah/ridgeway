<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
            -webkit-font-smoothing: antialiased;
        }
        input:focus {
            outline: none;
            border-color: #40534C;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col px-6 pt-12 pb-8">

    <!-- Header / Wordmark -->
    <header id="header" class="mb-12">
        <h1 class="text-[#1A3636] font-bold text-xl tracking-tight">Ridgeway</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-1">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-[#1A3636] mb-1">Reset password</h2>
        </div>

        <form id="reset-form" class="space-y-5" onsubmit="return false;">
            <!-- Email Field -->
            <div class="space-y-1.5">
                <label for="email" class="block text-[14px] font-semibold text-[#1A3636]">Email address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" 
                    class="w-full h-[44px] px-3 bg-white border border-[#E8E4DA] rounded-[6px] text-[15px] placeholder:text-[#677D6A]/50 transition-colors">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full h-[44px] bg-[#1A3636] text-white rounded-[8px] flex items-center justify-center font-semibold text-[16px] hover:bg-[#40534C] transition-colors mt-8">
                Send reset link
            </button>

            <!-- Back Link -->
            <div class="pt-4 text-center">
                <a href="sign-in.html" class="text-[14px] font-medium text-[#677D6A] hover:text-[#1A3636] transition-colors">
                    Back to sign in
                </a>
            </div>
        </form>
    </main>

</body>
</html>
