<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Ended</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
        .border-beige {
            border-color: #E8E4DA;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-white p-6">

    <div class="w-full max-w-[480px] text-center">
        <!-- Brand -->
        <div class="mb-16">
            <h1 class="text-[24px] font-bold tracking-tight">Ridgeway</h1>
        </div>

        <!-- Content Card -->
        <div class="space-y-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[#F7F5F0] rounded-full text-[#677D6A] mb-4">
                <i class="fa-solid fa-key text-2xl"></i>
            </div>
            
            <div class="space-y-4">
                <h2 class="text-[32px] font-bold leading-tight">You no longer have access to this unit</h2>
                <p class="text-[#677D6A] text-[18px] leading-relaxed">
                    The lease for Ridge Court B12 has ended. If you believe this is an error, please contact Ridgeway Property Group directly.
                </p>
            </div>

            <div class="pt-8 flex flex-col gap-4">
                <button class="w-full bg-[#1A3636] text-white py-4 rounded-[8px] font-semibold hover:bg-[#40534C] transition-colors">
                    Sign out
                </button>
            </div>
        </div>

        <footer class="mt-24 text-[14px] text-[#677D6A]">
            &copy; 2024 Ridgeway Property Group
        </footer>
    </div>

</body>
</html>
