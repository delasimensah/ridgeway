<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File a repair</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
        .border-beige {
            border-color: #E8E4DA;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1A3636;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Bar -->
    <header id="header" class="h-16 border-b border-beige px-8 flex items-center justify-between sticky top-0 bg-white z-10">
        <div class="text-[20px] font-bold tracking-tight">Ridgeway</div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Akosua Darko" class="w-8 h-8 rounded-full">
                <span class="font-semibold text-[14px]">Akosua Darko</span>
            </div>
            <button class="text-[#677D6A] text-[14px] hover:text-[#1A3636] transition-colors font-medium">Sign out</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[640px] mx-auto py-12 px-6">
        
        <header class="mb-10">
            <a href="home.html" class="text-[#677D6A] hover:text-[#1A3636] transition-colors inline-flex items-center gap-2 mb-6 text-[14px] font-medium">
                <i class="fa-solid fa-arrow-left"></i>
                Back to home
            </a>
            <h1 class="text-[32px] font-bold">File a repair</h1>
        </header>

        <form class="space-y-8" id="repair-form">
            <!-- Property Info (Read-only) -->
            <div class="bg-[#F7F5F0] p-4 rounded-[8px] flex justify-between items-center">
                <div>
                    <p class="text-[12px] font-bold text-[#677D6A] uppercase tracking-wider mb-1">Unit</p>
                    <p class="font-semibold">Ridge Court · B12</p>
                </div>
                <div class="text-right">
                    <p class="text-[12px] font-bold text-[#677D6A] uppercase tracking-wider mb-1">Status</p>
                    <span class="px-3 py-1 bg-[#677D6A] text-white text-[10px] font-bold rounded-full uppercase">New</span>
                </div>
            </div>

            <!-- Form Fields -->
            <div class="space-y-6">
                <div>
                    <label for="issue" class="block text-[14px] font-bold text-[#677D6A] uppercase tracking-wider mb-2">What’s wrong?</label>
                    <textarea id="issue" rows="4" placeholder="Describe the issue in detail..." class="w-full bg-white border border-beige p-4 rounded-[8px] resize-none text-[16px] transition-colors"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="category" class="block text-[14px] font-bold text-[#677D6A] uppercase tracking-wider mb-2">Category</label>
                        <select id="category" class="w-full bg-white border border-beige p-4 rounded-[8px] appearance-none cursor-pointer text-[16px] transition-colors">
                            <option value="">Select category</option>
                            <option value="plumbing">Plumbing</option>
                            <option value="electrical">Electrical</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="urgency" class="block text-[14px] font-bold text-[#677D6A] uppercase tracking-wider mb-2">Urgency</label>
                        <select id="urgency" class="w-full bg-white border border-beige p-4 rounded-[8px] appearance-none cursor-pointer text-[16px] transition-colors">
                            <option value="">Select urgency</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <!-- Photo Drop Zone -->
                <div>
                    <label class="block text-[14px] font-bold text-[#677D6A] uppercase tracking-wider mb-2">Photo</label>
                    <div class="border-2 border-dashed border-beige rounded-[8px] p-8 text-center bg-[#F7F5F0]/30 hover:bg-[#F7F5F0]/50 transition-colors cursor-pointer group">
                        <i class="fa-solid fa-camera text-[#677D6A] text-2xl mb-2 group-hover:text-[#1A3636] transition-colors"></i>
                        <p class="text-[14px] font-medium text-[#677D6A]">Add a photo</p>
                        <p class="text-[12px] text-[#677D6A]/70 mt-1">PNG, JPG up to 10MB</p>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <div class="pt-4 border-t border-beige flex gap-4">
                <button type="submit" class="bg-[#1A3636] text-white px-8 py-3 rounded-[8px] font-semibold hover:bg-[#40534C] transition-colors">
                    Submit repair
                </button>
                <a href="home.html" class="px-8 py-3 rounded-[8px] font-semibold text-[#677D6A] hover:bg-[#F7F5F0] transition-colors">
                    Cancel
                </a>
            </div>
        </form>

    </main>

    <footer id="footer" class="py-12 border-t border-beige mt-12">
        <div class="max-w-[640px] mx-auto px-6 text-[14px] text-[#677D6A]">
            &copy; 2024 Ridgeway Property Group
        </div>
    </footer>

</body>
</html>
