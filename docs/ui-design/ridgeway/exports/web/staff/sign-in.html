<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-[400px] flex flex-col items-center">
        <!-- Logo/Wordmark -->
        <div class="mb-12">
            <h1 class="text-[32px] font-bold tracking-tight text-[#1A3636]">Ridgeway</h1>
        </div>

        <!-- Sign In Form -->
        <div class="w-full">
            <form class="space-y-6" onsubmit="return false;">
                <div>
                    <label for="email" class="block text-[15px] font-semibold mb-2">Email address</label>
                    <input type="email" id="email" name="email" placeholder="jamie@example.com" 
                        class="w-full px-4 py-3 rounded-[8px] border border-[#E8E4DA] bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-[15px] font-semibold">Password</label>
                        <a href="forgot-password.html" class="text-[14px] font-medium text-[#677D6A] hover:text-[#1A3636] transition-colors">Forgot?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-[8px] border border-[#E8E4DA] bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                </div>

                <button type="submit" 
                    class="w-full bg-[#1A3636] text-white py-3 rounded-[8px] text-[16px] font-semibold hover:bg-[#40534C] transition-colors">
                    Sign in
                </button>
            </form>
        </div>

        <!-- Footer Text -->
        <div class="mt-12 text-center">
            <p class="text-[14px] text-[#677D6A]">Office, owners, and tenants use this site.</p>
        </div>
    </div>

</body>
</html>
