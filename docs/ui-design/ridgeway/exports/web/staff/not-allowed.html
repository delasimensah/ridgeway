<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-[480px]">
        <!-- Wordmark -->
        <div class="mb-16">
            <h1 class="text-[32px] font-bold tracking-tight text-[#1A3636]">Ridgeway</h1>
        </div>

        <div class="space-y-6">
            <h2 class="text-[28px] font-bold leading-tight">You don’t have permission to see this page.</h2>
            <p class="text-[16px] text-[#677D6A] leading-relaxed">
                Your account doesn't have the required access level for this area. If you believe this is an error, please reach out to your property manager.
            </p>
        </div>

        <div class="mt-12">
            <a href="sign-in.html" class="bg-[#1A3636] text-white px-10 py-3.5 rounded-[8px] text-[16px] font-semibold hover:bg-[#40534C] transition-colors inline-block">
                Sign out
            </a>
        </div>
    </div>

</html>
