<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add owner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
        .sidebar {
            background-color: #F7F5F0;
        }
        .border-beige {
            border-color: #E8E4DA;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 sidebar border-r border-beige flex flex-col fixed h-full">
        <div class="p-6">
            <h1 class="text-[24px] font-bold tracking-tight">Ridgeway</h1>
        </div>
        
        <nav class="flex-1 px-4 space-y-1">
            <a href="home.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-house w-5"></i>
                <span>Home</span>
            </a>
            <a href="building-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] bg-[#1A3636] text-white font-semibold">
                <i class="fa-solid fa-building w-5"></i>
                <span>Buildings</span>
            </a>
            <a href="repair-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-wrench w-5"></i>
                <span>Repairs</span>
            </a>
            <a href="rent-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-money-bill-transfer w-5"></i>
                <span>Rent</span>
            </a>
        </nav>

        <div class="p-4 border-t border-beige">
            <div class="flex items-center gap-3 px-4 py-2">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Ama Boateng" class="w-8 h-8 rounded-full">
                <div class="flex flex-col">
                    <span class="text-[14px] font-semibold">Ama Boateng</span>
                    <span class="text-[12px] text-[#677D6A]">Staff</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-12 max-w-[800px]">
        <header class="mb-12">
            <h2 class="text-[32px] font-bold">Add owner</h2>
        </header>

        <section class="bg-white border border-beige rounded-[8px] p-8 shadow-sm">
            <form class="space-y-6" onsubmit="return false;">
                <div>
                    <label for="name" class="block text-[15px] font-semibold mb-2">Full name</label>
                    <input type="text" id="name" placeholder="Kwesi Mensah" 
                        class="w-full px-4 py-3 rounded-[8px] border border-[#E8E4DA] bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                </div>

                <div>
                    <label for="email" class="block text-[15px] font-semibold mb-2">Email</label>
                    <input type="email" id="email" placeholder="kwesi@example.com" 
                        class="w-full px-4 py-3 rounded-[8px] border border-[#E8E4DA] bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                </div>

                <div>
                    <label for="phone" class="block text-[15px] font-semibold mb-2">Phone</label>
                    <input type="tel" id="phone" placeholder="024 555 0000" 
                        class="w-full px-4 py-3 rounded-[8px] border border-[#E8E4DA] bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                </div>

                <div class="bg-[#F7F5F0] p-4 rounded-[8px] border border-beige">
                    <p class="text-[14px] text-[#677D6A] leading-relaxed">
                        <i class="fa-solid fa-circle-info mr-2"></i>
                        This person will see only buildings linked to them.
                    </p>
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="submit" 
                        class="flex-1 bg-[#1A3636] text-white py-3 rounded-[8px] text-[16px] font-semibold hover:bg-[#40534C] transition-colors">
                        Save owner
                    </button>
                    <a href="building-list.html" 
                        class="px-8 py-3 rounded-[8px] border border-[#E8E4DA] text-[16px] font-semibold hover:bg-[#F7F5F0] transition-colors inline-flex items-center">
                        Cancel
                    </a>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
