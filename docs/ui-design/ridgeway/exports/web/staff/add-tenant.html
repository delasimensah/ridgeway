<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add tenant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
        .sidebar {
            background-color: #F7F5F0;
        }
        .border-beige {
            border-color: #E8E4DA;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 sidebar border-r border-beige flex flex-col fixed h-full">
        <div class="p-6">
            <h1 class="text-[24px] font-bold tracking-tight">Ridgeway</h1>
        </div>
        
        <nav class="flex-1 px-4 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-house w-5"></i>
                <span>Home</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] bg-[#1A3636] text-white font-semibold">
                <i class="fa-solid fa-building w-5"></i>
                <span>Buildings</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-wrench w-5"></i>
                <span>Repairs</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-money-bill-transfer w-5"></i>
                <span>Rent</span>
            </a>
        </nav>

        <div class="p-4 border-t border-beige">
            <div class="flex items-center gap-3 px-4 py-2">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Ama Boateng" class="w-8 h-8 rounded-full">
                <div class="flex flex-col">
                    <span class="text-[14px] font-semibold">Ama Boateng</span>
                    <span class="text-[12px] text-[#677D6A]">Staff</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-12 max-w-[800px]">
        <header class="mb-10">
            <div class="flex items-center gap-2 text-[#677D6A] mb-2 text-[14px] font-medium">
                <a href="#" class="hover:text-[#1A3636]">Ridge Court</a>
                <span>/</span>
                <span>B12</span>
            </div>
            <h2 class="text-[32px] font-bold">Add tenant</h2>
        </header>

        <!-- Form (Jobber Style Stacked) -->
        <div class="bg-white border border-beige rounded-[8px] shadow-sm p-8">
            <form class="space-y-6" onsubmit="return false;">
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-[15px] font-semibold mb-2">Name</label>
                        <input type="text" placeholder="Akosua Darko" 
                            class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[15px] font-semibold mb-2">Phone</label>
                            <input type="tel" placeholder="024 XXX XXXX" 
                                class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                        </div>
                        <div>
                            <label class="block text-[15px] font-semibold mb-2">Email</label>
                            <input type="email" placeholder="akosua@example.com" 
                                class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[15px] font-semibold mb-2">Rent (GH₵)</label>
                            <input type="number" value="4500" 
                                class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                        </div>
                        <div>
                            <label class="block text-[15px] font-semibold mb-2">Due day</label>
                            <input type="number" value="5" min="1" max="31"
                                class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[15px] font-semibold mb-2">Lease start</label>
                            <input type="date" 
                                class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                        </div>
                        <div>
                            <label class="block text-[15px] font-semibold mb-2">Lease end</label>
                            <input type="date" 
                                class="w-full px-4 py-3 rounded-[8px] border border-beige bg-white text-[16px] focus:outline-none focus:border-[#1A3636] transition-colors">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-4 pt-6">
                    <button type="button" class="px-6 py-3 text-[15px] font-semibold text-[#677D6A] hover:text-[#1A3636] transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="bg-[#1A3636] text-white px-8 py-3 rounded-[8px] text-[15px] font-semibold hover:bg-[#40534C] transition-colors">
                        Save tenant
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
