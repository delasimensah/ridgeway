<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
        .sidebar {
            background-color: #F7F5F0;
        }
        .border-beige {
            border-color: #E8E4DA;
        }
        .skeleton {
            background: linear-gradient(90deg, #F7F5F0 25%, #E8E4DA 50%, #F7F5F0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 sidebar border-r border-beige flex flex-col fixed h-full">
        <div class="p-6">
            <h1 class="text-[24px] font-bold tracking-tight">Ridgeway</h1>
        </div>
        
        <nav class="flex-1 px-4 space-y-1">
            <a href="home.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-house w-5"></i>
                <span>Home</span>
            </a>
            <a href="building-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] bg-[#1A3636] text-white font-semibold">
                <i class="fa-solid fa-building w-5"></i>
                <span>Buildings</span>
            </a>
            <a href="repair-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-wrench w-5"></i>
                <span>Repairs</span>
            </a>
            <a href="rent-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-money-bill-transfer w-5"></i>
                <span>Rent</span>
            </a>
        </nav>

        <div class="p-4 border-t border-beige">
            <div class="flex items-center gap-3 px-4 py-2">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Ama Boateng" class="w-8 h-8 rounded-full">
                <div class="flex flex-col">
                    <span class="text-[14px] font-semibold">Ama Boateng</span>
                    <span class="text-[12px] text-[#677D6A]">Staff</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-12 max-w-[1200px]">
        <header class="flex justify-between items-end mb-12">
            <div>
                <h2 class="text-[32px] font-bold">Buildings</h2>
            </div>
            <button class="bg-[#1A3636] opacity-50 text-white px-6 py-2.5 rounded-[8px] font-semibold cursor-not-allowed">
                Add building
            </button>
        </header>

        <!-- Skeleton Table -->
        <div class="bg-white border border-beige rounded-[8px] shadow-sm overflow-hidden">
            <div class="bg-[#F7F5F0] border-b border-beige px-6 py-4 flex gap-8">
                <div class="h-4 w-24 skeleton rounded"></div>
                <div class="h-4 w-48 skeleton rounded"></div>
                <div class="h-4 w-16 skeleton rounded"></div>
                <div class="h-4 w-24 skeleton rounded"></div>
            </div>
            <div class="divide-y divide-beige">
                <div class="px-6 py-6 flex gap-8">
                    <div class="h-5 w-24 skeleton rounded"></div>
                    <div class="h-5 w-48 skeleton rounded"></div>
                    <div class="h-5 w-16 skeleton rounded"></div>
                    <div class="h-5 w-24 skeleton rounded"></div>
                </div>
                <div class="px-6 py-6 flex gap-8">
                    <div class="h-5 w-24 skeleton rounded"></div>
                    <div class="h-5 w-48 skeleton rounded"></div>
                    <div class="h-5 w-16 skeleton rounded"></div>
                    <div class="h-5 w-24 skeleton rounded"></div>
                </div>
                <div class="px-6 py-6 flex gap-8">
                    <div class="h-5 w-24 skeleton rounded"></div>
                    <div class="h-5 w-48 skeleton rounded"></div>
                    <div class="h-5 w-16 skeleton rounded"></div>
                    <div class="h-5 w-24 skeleton rounded"></div>
                </div>
                <div class="px-6 py-6 flex gap-8">
                    <div class="h-5 w-24 skeleton rounded"></div>
                    <div class="h-5 w-48 skeleton rounded"></div>
                    <div class="h-5 w-16 skeleton rounded"></div>
                    <div class="h-5 w-24 skeleton rounded"></div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
