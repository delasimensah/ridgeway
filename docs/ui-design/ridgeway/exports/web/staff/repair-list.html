<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repairs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1A3636;
        }
        .sidebar {
            background-color: #F7F5F0;
        }
        .border-beige {
            border-color: #E8E4DA;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 sidebar border-r border-beige flex flex-col fixed h-full">
        <div class="p-6">
            <h1 class="text-[24px] font-bold tracking-tight">Ridgeway</h1>
        </div>
        
        <nav class="flex-1 px-4 space-y-1">
            <a href="home.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-house w-5"></i>
                <span>Home</span>
            </a>
            <a href="building-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-building w-5"></i>
                <span>Buildings</span>
            </a>
            <a href="repair-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] bg-[#1A3636] text-white font-semibold">
                <i class="fa-solid fa-wrench w-5"></i>
                <span>Repairs</span>
            </a>
            <a href="rent-list.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-[#1A3636] hover:bg-[#E8E4DA] transition-colors font-medium">
                <i class="fa-solid fa-money-bill-transfer w-5"></i>
                <span>Rent</span>
            </a>
        </nav>

        <div class="p-4 border-t border-beige">
            <div class="flex items-center gap-3 px-4 py-2">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Ama Boateng" class="w-8 h-8 rounded-full">
                <div class="flex flex-col">
                    <span class="text-[14px] font-semibold">Ama Boateng</span>
                    <span class="text-[12px] text-[#677D6A]">Staff</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-12 max-w-[1200px]">
        <header class="flex justify-between items-end mb-12">
            <div>
                <h2 class="text-[32px] font-bold">Repairs</h2>
            </div>
            <button class="bg-[#1A3636] text-white px-6 py-2.5 rounded-[8px] font-semibold hover:bg-[#40534C] transition-colors">
                Add repair
            </button>
        </header>

        <!-- Filters -->
        <div class="flex gap-2 mb-8">
            <button class="px-4 py-1.5 rounded-full bg-[#1A3636] text-white text-[14px] font-semibold">All</button>
            <button class="px-4 py-1.5 rounded-full border border-beige bg-white text-[#1A3636] text-[14px] font-semibold hover:bg-[#F7F5F0]">Received</button>
            <button class="px-4 py-1.5 rounded-full border border-beige bg-white text-[#1A3636] text-[14px] font-semibold hover:bg-[#F7F5F0]">Assigned</button>
            <button class="px-4 py-1.5 rounded-full border border-beige bg-white text-[#1A3636] text-[14px] font-semibold hover:bg-[#F7F5F0]">Scheduled</button>
            <button class="px-4 py-1.5 rounded-full border border-beige bg-white text-[#1A3636] text-[14px] font-semibold hover:bg-[#F7F5F0]">Done</button>
        </div>

        <!-- Table -->
        <div class="bg-white border border-beige rounded-[8px] shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-[#F7F5F0] border-b border-beige">
                        <th class="px-6 py-4 text-[13px] font-bold text-[#677D6A] uppercase tracking-wider">Ticket</th>
                        <th class="px-6 py-4 text-[13px] font-bold text-[#677D6A] uppercase tracking-wider">Building</th>
                        <th class="px-6 py-4 text-[13px] font-bold text-[#677D6A] uppercase tracking-wider">Unit</th>
                        <th class="px-6 py-4 text-[13px] font-bold text-[#677D6A] uppercase tracking-wider">Title</th>
                        <th class="px-6 py-4 text-[13px] font-bold text-[#677D6A] uppercase tracking-wider">Status</th>
                        <th class="px-6 py-4 text-[13px] font-bold text-[#677D6A] uppercase tracking-wider">Assigned to</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-beige">
                    <tr class="hover:bg-[#F7F5F0] transition-colors cursor-pointer" onclick="window.location.href='repair-detail.html'">
                        <td class="px-6 py-4 font-semibold text-[15px]">WO-184</td>
                        <td class="px-6 py-4 text-[15px]">Ridge Court</td>
                        <td class="px-6 py-4 text-[15px]">B12</td>
                        <td class="px-6 py-4 text-[15px]">Kitchen tap leak</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-[#40534C] text-white text-[12px] font-bold rounded-full">ASSIGNED</span>
                        </td>
                        <td class="px-6 py-4 text-[15px]">Kojo Asante</td>
                    </tr>
                    <tr class="hover:bg-[#F7F5F0] transition-colors cursor-pointer" onclick="window.location.href='repair-detail.html'">
                        <td class="px-6 py-4 font-semibold text-[15px]">WO-183</td>
                        <td class="px-6 py-4 text-[15px]">Ridge Court</td>
                        <td class="px-6 py-4 text-[15px]">Shop 2</td>
                        <td class="px-6 py-4 text-[15px]">Shop 2 AC</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-[#677D6A] text-white text-[12px] font-bold rounded-full">RECEIVED</span>
                        </td>
                        <td class="px-6 py-4 text-[15px] text-[#677D6A]">—</td>
                    </tr>
                    <tr class="hover:bg-[#F7F5F0] transition-colors cursor-pointer" onclick="window.location.href='repair-detail.html'">
                        <td class="px-6 py-4 font-semibold text-[15px]">WO-182</td>
                        <td class="px-6 py-4 text-[15px]">Ridge Court</td>
                        <td class="px-6 py-4 text-[15px]">A4</td>
                        <td class="px-6 py-4 text-[15px]">Unit A4 lock</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-[#D6BD98] text-[#1A3636] text-[12px] font-bold rounded-full">SCHEDULED</span>
                        </td>
                        <td class="px-6 py-4 text-[15px]">Kojo Asante</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
