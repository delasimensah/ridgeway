name: Preview builds

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview
  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview
  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: preview
  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
      refresh_ad_hoc_provisioning_profile: true
  notify:
    name: Notify on Slack
    after: [get_android_build, get_ios_build, build_android, build_ios]
    type: slack
    environment: preview
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      message: |
        Preview builds — Android: ${{ after.build_android.status }}, iOS: ${{ after.build_ios.status }}
        Workflow: ${{ workflow.url }}
        Android: https://expo.dev/accounts/dm-studios/projects/ridgeway/builds/${{ after.build_android.outputs.build_id || after.get_android_build.outputs.build_id }}
        iOS: https://expo.dev/accounts/dm-studios/projects/ridgeway/builds/${{ after.build_ios.outputs.build_id || after.get_ios_build.outputs.build_id }}
